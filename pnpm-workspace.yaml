packages:
  - projects/*
  - projects/ciszu/*
  - projects/ciszubot/*
  - projects/ciszukoantony/*
  - projects/muzicmania/*
  - packages/*

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  '@sentry/cli': true
  workerd: true
  '@parcel/watcher': true
  msw: true
  phaser: true
  pixi.js: true

overrides:
  undici: 8.12.2
  body-parser: 1.20.9
  happy-dom@>=17.0.0 <=21.0.3: '>=21.0.4'
  brace-expansion: '>=5.0.12'
  postcss: 8.5.25
  js-yaml: '>=5.4.2'
  read-yaml-file: 2.1.0
  nanoid@^3: 3.3.18
  minimatch@^9: 9.0.7
  '@typescript-eslint/eslint-plugin': 8.63.0
  '@typescript-eslint/parser': 8.63.0
  uuid: 13.0.1
  tmp: ^0.2.7
  browserslist: ^4.28.7
  '@tiptap/core': ^3.31.3
  fast-uri: '>=4.2.3'
  qs: '>=6.16.1'
  fastify@<5.12.6: '>=5.12.6'
  '@nestjs/platform-fastify@<11.2.4': 11.2.4
  zod@>=4.0.0 <4.6.6: '>=4.6.6'
  proxy-addr@<2.0.8: '>=2.0.8'
  source-map-js@<1.2.2: '>=1.2.2'
  vite@<8.2.4: '>=8.3.5'
  vitest@>=2.1.0 <4.1.11: '>=4.1.11'
  '@vitest/mocker@<4.1.12': '>=4.1.12'
  '@vitest/mocker@>=5.0.0 <5.0.3': '>=5.0.3'
  sharp@<0.35.5: '>=0.35.5'

engineStrict: true

preferFrozenLockfile: true

shamefullyHoist: false

permissions:
  phaser:
    skills: true
  pixi.js:
    skills: true
