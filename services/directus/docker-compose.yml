services:
  directus:
    image: directus/directus:11.7.1
    container_name: ciszunetwork-directus
    restart: unless-stopped
    ports:
      - "8055:8055"
    environment:
      # Base de datos: apunta al Postgres de Supabase (vía conexión directa o pooler).
      # Credenciales desde vault/services/supabase/.env — NUNCA hardcodear aquí.
      DB_CLIENT: "pg"
      DB_HOST: "${DIRECTUS_DB_HOST}"
      DB_PORT: "${DIRECTUS_DB_PORT:-5432}"
      DB_DATABASE: "${DIRECTUS_DB_DATABASE:-postgres}"
      DB_USER: "${DIRECTUS_DB_USER}"
      DB_PASSWORD: "${DIRECTUS_DB_PASSWORD}"

      # Dominio público y secret (generar con `openssl rand -base64 32`).
      PUBLIC_URL: "${DIRECTUS_PUBLIC_URL:-http://localhost:8055}"
      KEY: "${DIRECTUS_KEY}"
      SECRET: "${DIRECTUS_SECRET}"

      # Almacenamiento de archivos: Supabase Storage (ciszu-cdn) en vez de local.
      STORAGE_LOCATIONS: "s3"
      STORAGE_S3_DRIVER: "s3"
      STORAGE_S3_KEY: "${DIRECTUS_S3_KEY}"
      STORAGE_S3_SECRET: "${DIRECTUS_S3_SECRET}"
      STORAGE_S3_BUCKET: "ciszu-cdn"
      STORAGE_S3_ENDPOINT: "${DIRECTUS_S3_ENDPOINT}"
      STORAGE_S3_REGION: "auto"
      STORAGE_S3_FORCE_PATH_STYLE: "true"
      STORAGE_S3_ROOT: "${DIRECTUS_S3_ROOT:-directus/}"

      # Admin inicial (solo primer arranque).
      ADMIN_EMAIL: "${DIRECTUS_ADMIN_EMAIL}"
      ADMIN_PASSWORD: "${DIRECTUS_ADMIN_PASSWORD}"
    volumes:
      - directus_uploads:/directus/uploads
      - ./extensions:/directus/extensions
    # El proyecto de BD de Supabase exige RLS; Directus usa su propio panel.
    # El schema `directus` debe crearse con RLS y grants acotados. Ver nota abajo.

volumes:
  directus_uploads:

# Nota de selección (TOOLS_EVALUATION_PLAN §4/§9.4): Directus es ⚠️ condicional —
# solo si aparecen editores de contenido. Solapa con Supabase Studio; usar
# exclusivamente para el panel editorial (no genera migraciones del esquema).
# Prerequisito SQL en el proyecto Supabase:
#   CREATE SCHEMA directus;
#   GRANT USAGE, CREATE ON SCHEMA directus TO directus_user;
#   (RLS activado — ver SECURITY_PROTOCOLS.md)