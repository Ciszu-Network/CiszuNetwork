name: MuzicMania CI/CD

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                version: 9
            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20.x'
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - name: Run Lint
              run: pnpm run lint
            - name: Build Icons
              run: pnpm run icons:build
            - name: TypeScript Check
              run: pnpm run verify
            - name: Production Build
              run: pnpm run build
