app-id: network.ciszu.muzicmania
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable//25.08
command: muzicmania
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-download
  - --filesystem=xdg-config/autostart:create
  - --filesystem=xdg-data/applications:create
modules:
  - name: muzicmania
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/muzicmania/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo build --release --manifest-path projects/muzicmania/launcher/src-tauri/Cargo.toml
      - install -Dm755 projects/muzicmania/launcher/src-tauri/target/release/muzicmania /app/bin/muzicmania
      - install -Dm644 projects/muzicmania/packaging/assets/network.ciszu.muzicmania.desktop /app/share/applications/network.ciszu.muzicmania.desktop
      - install -Dm644 projects/muzicmania/packaging/assets/network.ciszu.muzicmania.metainfo.xml /app/share/metainfo/network.ciszu.muzicmania.metainfo.xml
      - install -Dm644 projects/muzicmania/launcher/src-tauri/icons/512x512.png /app/share/icons/hicolor/512x512/apps/network.ciszu.muzicmania.png
      - install -Dm644 projects/muzicmania/launcher/src-tauri/LICENSE.txt /app/share/licenses/network.ciszu.muzicmania/LICENSE
    sources:
      - cargo-sources.json
      - type: archive
        url: https://github.com/Ciszu-Network/CiszuNetwork/releases/download/launcher-v2.4.2-beta.2/muzicmania-2.4.2-src.tar.gz
        sha256: f3361bb7ed2f7e36c2066b1528dcf1c9d8cb902740db5d26ed57f82a2e89b79b
