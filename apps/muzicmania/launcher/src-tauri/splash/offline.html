<script>
// Bloquear atajos de navegador y click derecho
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
  if (e.key === 'F3' || e.key === 'F5' || e.key === 'F12' || (e.ctrlKey && ['p','r','f'].includes(e.key.toLowerCase()))) {
    e.preventDefault();
  }
});

async function launchOffline() {
  try {
    await window.__TAURI_INTERNALS__.invoke('launcher_ready');
  } catch(e) {
    alert("Error al iniciar modo offline. Asegúrate de iniciar desde el Launcher de Tauri.");
  }
}
</script>
