services:
  directus:
    image: directus/directus:latest
    container_name: ciszu-directus
    ports:
      - "8055:8055"
    environment:
      KEY: "${DIRECTUS_KEY:-ciszu-local-dev-key}"
      SECRET: "${DIRECTUS_SECRET:-ciszu-local-dev-secret-not-production}"
      ADMIN_EMAIL: "${DIRECTUS_ADMIN_EMAIL:-admin@example.com}"
      ADMIN_PASSWORD: "${DIRECTUS_ADMIN_PASSWORD:-admin}"
      DB_CLIENT: "sqlite3"
      DB_FILENAME: "/directus/database/data.db"
      PUBLIC_URL: "http://localhost:8055"
    volumes:
      - ./data:/directus/database
    restart: unless-stopped