# CISZU Network - kitty.conf
# Paleta de marca: cyan/rosa sobre negro. Fuente monoespaciada con fallback.

font_family      JetBrainsMono Nerd Font
font_family      JetBrains Mono
font_family      monospace
bold_font        auto
italic_font      auto
font_size        11.0
adjust_line_height 0

foreground            #e6ebf5
background            #050a14
selection_foreground  #050a14
selection_background  #34e2e2
cursor                #ff5c90
cursor_text_color     #050a14
url_color             #34e2e2

# Paleta ANSI (marca)
color0  #0b1220
color1  #ff5c90
color2  #8ae234
color3  #ddb055
color4  #3b82f6
color5  #ad45ff
color6  #34e2e2
color7  #c8d0dd
color8  #3a4456
color9  #ff7aa8
color10 #a6f05a
color11 #f0c674
color12 #60a5fa
color13 #c084fc
color14 #67e8f9
color15 #f2f5fa

# Ventana
window_padding_width 8
background_opacity   0.96
confirm_os_window_close 0
remember_window_size  yes
initial_window_width  1200
initial_window_height 720

# Pestañas (estilo Windows Terminal: barra siempre visible arriba)
# Cerrar: Ctrl+Shift+W o clic central sobre la pestaña. Kitty no tiene boton X nativo.
tab_bar_style        powerline
tab_powerline_style  slanted
tab_bar_edge         top
tab_bar_align        left
tab_bar_min_tabs     1
tab_bar_show_new_tab_button yes
tab_bar_margin_width 4
tab_title_template   "{index}: {title}"
active_tab_background   #34e2e2
active_tab_foreground   #050a14
inactive_tab_background #0b1220
inactive_tab_foreground #c8d0dd
tab_bar_background      #050a14

# Shell
shell zsh
shell_integration enabled
copy_on_select no

# Atajos utiles
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+w close_tab
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+left previous_tab
map ctrl+shift+right next_tab
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5
map ctrl+shift+6 goto_tab 6
map ctrl+shift+7 goto_tab 7
map ctrl+shift+8 goto_tab 8
map ctrl+shift+9 goto_tab 9
map ctrl+shift+plus change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0 change_font_size all 0
