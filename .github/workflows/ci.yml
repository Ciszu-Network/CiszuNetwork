name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Cotidianización: el pipeline de seguridad completo corre diario (06:00 UTC)
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: self-hosted
    strategy:
      matrix:
        app: [ciszunetwork-website, ciszukoantony-website, muzicmania-website]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter ${{ matrix.app }} lint

  unit-tests:
    name: Tests unitarios (Vitest)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
      - run: pnpm install
      - run: pnpm test

  storybook-tests:
    name: Tests de componente Storybook (Vitest + Playwright)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
      - run: pnpm install
      - name: Instalar browsers de Playwright (chromium, para @vitest/browser)
        run: pnpm exec playwright install chromium
      - name: Tests de interacción de stories (addon-vitest)
        run: pnpm --filter @ciszu/ui test:storybook

  # ── Seguridad (SAST/SCA/DACP/DAST) — tareas concurrentes ───────────────────
  # NOTA (sistema híbrido): los jobs de abajo usan contenedores Linux/acciones
  # oficiales y NO son portables al runner self-hosted de Windows. Corren en
  # ubuntu-latest; si el billing sigue bloqueado, replicarlos localmente con los
  # comandos documentados en ACTIONS_RUNNERS_SYSTEM.md §5.4.

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: returntocorp/semgrep-action@v1
        with:
          config: p/security-audit
          publishToken: ${{ secrets.SEMGREP_APP_TOKEN }}

  audit:
    name: pnpm audit (SCA)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
      - run: pnpm install
      # 0 vulns requerido: fail si hay HIGH/CRITICAL (audit-level high)
      - run: pnpm audit --prod --audit-level high

  gitleaks:
    name: Gitleaks (Secret scanning / DACP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar gitleaks v8.30.1 (binary oficial)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Escaneo de secrets (diff del push/PR)
        # NO escanear el historial completo: contiene ~135 leaks históricos
        # conocidos (`.turbo/runs/*.json` destrackeados, cloudflare-api-key ×3,
        # beacon de Cloudflare Web Analytics) documentados en AGENTS.md — el
        # `gitleaks detect --all` los bloquearía SIEMPRE. Este paso escanea
        # solo los commits nuevos del evento (push/PR), que es donde entran
        # secrets NUEVOS. Los leaks del historial se purgan con filter-branch
        # si el repo se hace público.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            LOG_OPTS="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            LOG_OPTS="HEAD~5..HEAD"
          elif [ "${{ github.event_name }}" = "push" ]; then
            LOG_OPTS="${{ github.event.before }}..${{ github.sha }}"
          else
            # schedule/workflow_dispatch no tienen `github.event.before`
            LOG_OPTS="HEAD~5..HEAD"
          fi
          echo "Escaneando git log -p ${LOG_OPTS}"
          gitleaks detect --redact --log-opts="${LOG_OPTS}"

  security-e2e:
    name: Security E2E (DAST interactivo)
    needs: [unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # El spec espera hasta 180s a que terminen los deploys de Vercel
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
      - run: pnpm install
      # El spec usa la fixture `request` (sin navegador) → no hace falta
      # `npx playwright install` en este job.
      - name: Security E2E contra producción
        run: pnpm exec playwright test test/website/e2e/security.spec.ts --reporter=line
      - name: Subir reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-e2e-report
          path: test/website/e2e/reports/
          retention-days: 14
