name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [ciszunetwork, ciszukoantony, muzicmania]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter ${{ matrix.app == 'ciszunetwork' && 'ciszunetwork-page' || matrix.app == 'ciszukoantony' && 'ciszuko-network' || 'muzicmania-next' }} lint

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: returntocorp/semgrep-action@v1
        with:
          config: p/security-audit
          publishToken: ${{ secrets.SEMGREP_APP_TOKEN }}
