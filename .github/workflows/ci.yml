name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Cotidianización: el pipeline de seguridad completo corre diario (06:00 UTC)
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [ciszunetwork-website, ciszukoantony-website, muzicmania-website]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter ${{ matrix.app }} lint

  unit-tests:
    name: Tests unitarios (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
      - run: pnpm install
      - run: pnpm test

  # ── Seguridad (SAST/SCA/DACP/DAST) — tareas concurrentes ───────────────────

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: returntocorp/semgrep-action@v1
        with:
          config: p/security-audit
          publishToken: ${{ secrets.SEMGREP_APP_TOKEN }}

  audit:
    name: pnpm audit (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
      - run: pnpm install
      # 0 vulns requerido: fail si hay HIGH/CRITICAL (audit-level high)
      - run: pnpm audit --prod --audit-level high

  gitleaks:
    name: Gitleaks (Secret scanning / DACP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar gitleaks v8.30.1 (binary oficial)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Escaneo de secrets (historial completo)
        run: gitleaks detect --log-opts="--all" --exit-code 1 --redact

  security-e2e:
    name: Security E2E (DAST interactivo)
    needs: [unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # El spec espera hasta 180s a que terminen los deploys de Vercel
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
      - run: pnpm install
      # El spec usa la fixture `request` (sin navegador) → no hace falta
      # `npx playwright install` en este job.
      - name: Security E2E contra producción
        run: pnpm exec playwright test test/website/e2e/security.spec.ts --reporter=line
      - name: Subir reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-e2e-report
          path: test/website/e2e/reports/
          retention-days: 14
