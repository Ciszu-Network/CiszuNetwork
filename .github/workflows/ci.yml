name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [ciszunetwork, ciszukoantony, muzicmania]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter ${{ matrix.app == 'ciszunetwork' && 'ciszunetwork-page' || matrix.app == 'ciszukoantony' && 'ciszuko-network' || 'muzicmania-next' }} lint
