name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Cotidianización: el pipeline de seguridad completo corre diario (06:00 UTC)
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  # Grupo por evento (push/schedule/pull_request) para que el schedule diario
  # o los PRs no cancelen el CI de un push en curso (y viceversa). Dentro del
  # mismo evento+ref, un run nuevo sí cancela al anterior (solo corre el último).
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ${{ vars.PREFERRED_RUNNER || 'self-hosted' }}
    strategy:
      matrix:
        app: [ciszunetwork-website, ciszukoantony-website, muzicmania-website, ciszubot-website]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          dest: ~/setup-pnpm-${{ runner.name }}
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter ${{ matrix.app }} lint

  unit-tests:
    name: Tests unitarios (Vitest)
    runs-on: ${{ vars.PREFERRED_RUNNER || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          dest: ~/setup-pnpm-${{ runner.name }}
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
      - run: pnpm install
      - run: pnpm test

  storybook-tests:
    name: Tests de componente Storybook (Vitest + Playwright)
    runs-on: ${{ vars.PREFERRED_RUNNER || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          dest: ~/setup-pnpm-${{ runner.name }}
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
      - run: pnpm install
      - name: Instalar browsers de Playwright (chromium, para @vitest/browser)
        run: pnpm exec playwright install chromium
      - name: Tests de interacción de stories (addon-vitest)
        run: pnpm --filter @ciszu/ui test:storybook

  # ── Seguridad (SAST/SCA/DACP) — tareas concurrentes ────────────────────────
  # NOTA (sistema híbrido, 16 ago 2026): el billing de runners hosted está
  # bloqueado, así que TODOS los jobs corren en el runner self-hosted Windows.
  # Las acciones que usaban contenedores Linux se reemplazaron por el CLI nativo
  # (semgrep vía pip, gitleaks binario Windows). Ver ACTIONS_RUNNERS_SYSTEM.md.

  semgrep:
    name: Semgrep (SAST)
    runs-on: ${{ vars.PREFERRED_RUNNER || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v4
      # El runner corre como NETWORK SERVICE: no existe `py` de usuario ni se
      # pueden instalar MSIs (`actions/setup-python` usa un runtime MSI y falla).
      # Se usa el paquete NuGet portable de Python (trae pip, sin instalación).
      # En runners Linux (PREFERRED_RUNNER=ubuntu-latest) se usa setup-python.
      - name: Instalar Python (Linux runner)
        if: runner.os != 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Python portable (NuGet, sin MSI) [Windows runner]
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'python-nuget.zip'
          $nugetUrl = 'https://www.nuget.org/api/v2/package/python/3.12.10'
          # curl.exe (incluido en Windows 10+) evita el truncado de archivos
          # grandes que sufre Invoke-WebRequest en PowerShell 5.1 (zip corrupto).
          curl.exe -sL $nugetUrl -o $zip
          $pyDir = Join-Path $env:RUNNER_TEMP 'pynuget\d'
          New-Item -ItemType Directory -Path $pyDir -Force | Out-Null
          Expand-Archive -Path $zip -DestinationPath $pyDir -Force
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $pyDir 'tools')
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $pyDir 'tools\Scripts')
      - name: Instalar Semgrep
        run: python -m pip install --quiet --disable-pip-version-check semgrep==1.172.0
      - name: Escaneo Semgrep (p/security-audit)
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: semgrep scan --config p/security-audit --metrics=off --oss-only --exclude node_modules --exclude .next --exclude .turbo --exclude lockfile

  audit:
    name: pnpm audit (SCA)
    runs-on: ${{ vars.PREFERRED_RUNNER || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          dest: ~/setup-pnpm-${{ runner.name }}
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
      - run: pnpm install
      # 0 vulns requerido: fail si hay HIGH/CRITICAL (audit-level high)
      - run: pnpm audit --prod --audit-level high

  gitleaks:
    name: Gitleaks (Secret scanning / DACP)
    runs-on: ${{ vars.PREFERRED_RUNNER || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar gitleaks v8.30.1 (binary Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'gitleaks.zip'
          curl.exe -sL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip -o $zip
          $dest = Join-Path $env:RUNNER_TEMP 'gitleaks'
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $exe = Join-Path $dest 'gitleaks.exe'
          Add-Content -Path $env:GITHUB_PATH -Value $dest
          & $exe version | Write-Host
      - name: Instalar gitleaks v8.30.1 (binary Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -O gitleaks.tar.gz
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
          gitleaks version
      - name: Escaneo de secrets (diff del push/PR) [Windows]
        # NO escanear el historial completo: contiene ~135 leaks históricos
        # conocidos (`.turbo/runs/*.json` destrackeados, cloudflare-api-key ×3,
        # beacon de Cloudflare Web Analytics) documentados en AGENTS.md — el
        # `gitleaks detect --all` los bloquearía SIEMPRE. Este paso escanea
        # solo los commits nuevos del evento (push/PR), que es donde entran
        # secrets NUEVOS.
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $LOG_OPTS = "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          } elseif ($env:GITHUB_EVENT_NAME -eq 'push' -and "${{ github.event.before }}" -eq '0000000000000000000000000000000000000000') {
            $LOG_OPTS = 'HEAD~5..HEAD'
          } elseif ($env:GITHUB_EVENT_NAME -eq 'push') {
            $LOG_OPTS = "${{ github.event.before }}..${{ github.sha }}"
          } else {
            $LOG_OPTS = 'HEAD~5..HEAD'
          }
          Write-Host "Escaneando git log -p $LOG_OPTS"
          gitleaks detect --redact "--log-opts=$LOG_OPTS"
      - name: Escaneo de secrets (diff del push/PR) [Linux]
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            LOG_OPTS="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            LOG_OPTS="HEAD~5..HEAD"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            LOG_OPTS="${{ github.event.before }}..${{ github.sha }}"
          else
            LOG_OPTS="HEAD~5..HEAD"
          fi
          echo "Escaneando git log -p $LOG_OPTS"
          gitleaks detect --redact --log-opts="$LOG_OPTS"

  security-e2e:
    name: Security E2E (DAST interactivo)
    needs: [unit-tests]
    runs-on: ${{ vars.PREFERRED_RUNNER || 'self-hosted' }}
    timeout-minutes: 20
    env:
      # El spec espera hasta 180s a que terminen los deploys de Vercel
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          dest: ~/setup-pnpm-${{ runner.name }}
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
      - run: pnpm install
      # El spec usa la fixture `request` (sin navegador) → no hace falta
      # `npx playwright install` en este job.
      - name: Security E2E contra producción
        run: pnpm exec playwright test test/website/e2e/security.spec.ts --reporter=line
      - name: Subir reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-e2e-report
          path: test/website/e2e/reports/
          retention-days: 14
