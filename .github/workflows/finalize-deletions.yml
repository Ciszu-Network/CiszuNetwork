name: Finalize Deletions

# Finaliza las eliminaciones de cuenta vencidas (15 días sin recuperar):
# invalida credenciales y validación y marca el estado como `expired`.
# Los datos, el UUID y el vínculo con el correo PERMANECEN.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ${{ vars.PREFERRED_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Finalizar eliminaciones vencidas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/finalize-deletions.js
