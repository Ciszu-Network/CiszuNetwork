# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: '28 16 * * 5'

jobs:
  # CodeQL es gratis en repos publicos; en privados requiere GitHub Advanced Security.
  # El check de abajo habilita el analisis cuando el repo es publico o GHAS esta activo.
  # NOTA (16 ago 2026): billing de runners hosted bloqueado → corren en el runner self-hosted Windows.
  check:
    name: Check Advanced Security
    runs-on: ${{ vars.PREFERRED_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.check-win.outputs.enabled || steps.check-lin.outputs.enabled }}
    steps:
      # CodeQL es gratis en repos publicos (no requiere GHAS). En repos
      # privados requiere Advanced Security habilitado. En cualquier caso que
      # el analisis pueda correr, se marca enabled=true.
      - name: Check if Advanced Security is enabled [Windows]
        if: runner.os == 'Windows'
        id: check-win
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $visibility = gh api "repos/$env:GITHUB_REPOSITORY" --jq '.visibility' 2>$null
          $status = gh api "repos/$env:GITHUB_REPOSITORY" --jq '.security_and_analysis.advanced_security.status' 2>$null
          if ($visibility -eq 'public' -or $status -eq 'enabled') {
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'enabled=true'
          } else {
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'enabled=false'
          }
      - name: Check if Advanced Security is enabled [Linux]
        if: runner.os != 'Windows'
        id: check-lin
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          visibility=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.visibility' 2>/dev/null || true)
          status=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.security_and_analysis.advanced_security.status' 2>/dev/null || true)
          if [ "$visibility" = "public" ] || [ "$status" = "enabled" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: check
    if: needs.check.outputs.enabled == 'true'
    # Runner size impacts CodeQL analysis time. Ver gh.io/recommended-hardware-resources.
    runs-on: ${{ vars.PREFERRED_RUNNER || 'ubuntu-latest' }}
    permissions:
      # required for all workflows
      security-events: write
      # required to fetch internal or private CodeQL packs
      packages: read
      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: javascript-typescript
          build-mode: none
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Add any setup steps before running the `github/codeql-action/init` action.
    # This includes steps like installing compilers or runtimes (`actions/setup-node`
    # or others). This is typically only required for manual builds.
    # - name: Setup runtime (example)
    #   uses: actions/setup-example@v1

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.

        # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        # queries: security-extended,security-and-quality

    # If the analyze step fails for one of the languages you are analyzing with
    # "We were unable to automatically build your code", modify the matrix above
    # to set the build mode to "manual" for that language. Then modify this step
    # to build your code.
    # ℹ️ Command-line programs to run using the OS shell.
    # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun
    - name: Run manual build steps
      if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        echo 'If you are using a "manual" build mode for one or more of the' \
          'languages you are analyzing, replace this with the commands to build' \
          'your code, for example:'
        echo '  make bootstrap'
        echo '  make release'
        exit 1

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
