name: Publish Package

on:
  release:
    types: [published]  # Se dispara cuando creas un Release en GitHub

jobs:
  pypi-publish:
    name: Build, TestPyPI and PyPI Publish
    runs-on: ubuntu-latest
    
    # ⚠️ OBLIGATORIO para que OpenID Connect (Trusted Publishing) funcione
    permissions:
      id-token: write
      attestations: write  # Permiso necesario para firmar digitalmente en PyPI oficial
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          
      - name: Install Poetry
        uses: snok/install-poetry@v1
        
      - name: Build package with Poetry
        working-directory: projects/ciszupy/python-package
        run: poetry build
        
      # 1️⃣ Primero a TestPyPI (desactivamos las attestations aquí para evitar el conflicto)
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: false  # 👈 Evita el error de archivos duplicados de certificación
          packages-dir: projects/ciszupy/python-package/dist
          
      # 2️⃣ Después al PyPI oficial de producción (aquí sí las genera y sube con éxito)
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: projects/ciszupy/python-package/dist