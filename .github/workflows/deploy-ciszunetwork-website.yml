name: Deploy CiszuNetwork Website

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Entorno del deploy (production o preview)
        required: true
        default: production
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ${{ vars.PREFERRED_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          dest: ~/setup-pnpm-${{ runner.name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install Vercel CLI
        run: pnpm add -g vercel
      - name: Link Vercel Project
        run: vercel link --yes --project ciszunetworkpage --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: projects/ciszu/website
      - name: Deploy to Vercel
        if: runner.os == 'Windows'
        shell: powershell
        env:
          IS_PREVIEW: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'preview' }}
        run: |
          if ($env:IS_PREVIEW -eq 'true') {
            vercel --yes --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}
          } else {
            vercel --prod --yes --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}
          }
        working-directory: projects/ciszu/website
      - name: Deploy to Vercel (Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          IS_PREVIEW: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'preview' }}
        run: |
          if [ "$IS_PREVIEW" = "true" ]; then
            vercel --yes --archive=tgz --token="${{ secrets.VERCEL_TOKEN }}"
          else
            vercel --prod --yes --archive=tgz --token="${{ secrets.VERCEL_TOKEN }}"
          fi
        working-directory: projects/ciszu/website