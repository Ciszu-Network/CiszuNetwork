name: sponsorship-cron

# Envío diario de patrocinios del ecosistema (cada 24h).
# Llama a POST /api/sponsorship/dispatch de la web principal; el endpoint
# respeta las preferencias de cada usuario (notification_preferences).
# La cadencia se puede ajustar; se usa una hora fija (08:00 UTC).

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ${{ vars.PREFERRED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Enviar patrocinios del día
        env:
          DISPATCH_URL: https://ciszunetwork.vercel.app/api/sponsorship/dispatch
          SPONSORSHIP_CRON_SECRET: ${{ secrets.SPONSORSHIP_CRON_SECRET }}
        run: |
          curl -sS -X POST "$DISPATCH_URL" \
            -H "Authorization: Bearer ${SPONSORSHIP_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -w "\nHTTP %{http_code}\n"