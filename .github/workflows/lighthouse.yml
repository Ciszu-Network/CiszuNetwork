name: Lighthouse CI

on:
  # Semanal (lunes 07:00 UTC) + manual. Antes corría en cada push/PR y cada run
  # hace 4 auditorías Lighthouse completas contra producción (full load con
  # todos los recursos y requests de auditoría). Con el fair-use de Vercel
  # (Fluid CPU/Edge Requests) esto era un golpe recurrente y desproporcionado
  # para detectar regresiones que un chequeo semanal ya cubre.
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

concurrency:
  # GitHub puede entregar el mismo push dos veces (duplicado); sin este
  # grupo se lanzarian DOS analisis en paralelo del mismo ref. El run mas
  # nuevo cancela al anterior.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://ciszunetwork.vercel.app
            https://ciszukoantony.vercel.app
            https://ciszubot.vercel.app
            https://muzicmania.vercel.app
          config: |
            {
              "ci": {
                "collect": {
                  "numberOfRuns": 1
                },
                "assert": {
                  "preset": "lighthouse:recommended"
                }
              }
            }
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
