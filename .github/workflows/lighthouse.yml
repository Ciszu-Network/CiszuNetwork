name: Lighthouse CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  pull-requests: write

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ${{ vars.PREFERRED_RUNNER || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          dest: ~/.local/share/pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome (Windows self-hosted)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # Chrome ya debería estar instalado en el runner self-hosted Windows
          # Si no, instalar con winget
          if (-not (Get-Command "chrome.exe" -ErrorAction SilentlyContinue)) {
            winget install --id Google.Chrome --silent --accept-source-agreements --accept-package-agreements
          }

      - name: Install Chrome (Linux self-hosted)
        if: runner.os != 'Windows'
        run: |
          if ! command -v google-chrome-stable &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y google-chrome-stable
          fi

      - name: Run Lighthouse CI
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        run: |
          if [ -z "${LHCI_GITHUB_APP_TOKEN}" ]; then
            echo "LHCI_GITHUB_APP_TOKEN no configurado - saltando upload a LHCI"
            pnpm lhci:collect
            pnpm lhci:assert
          else
            pnpm lhci:full
          fi