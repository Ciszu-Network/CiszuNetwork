name: Deploy MuzicMania Website

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Entorno del deploy (production o preview)
        required: true
        default: production
        type: choice
        options:
          - preview
          - production

concurrency:
  # GitHub puede entregar el mismo push dos veces (duplicado); sin este
  # grupo se lanzarian DOS deploys/analisis en paralelo del mismo ref. El run
  # mas nuevo cancela al anterior (los deploys de Vercel son atomicos: la
  # produccion previa se mantiene hasta que el nuevo termine).
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ${{ vars.PREFERRED_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          dest: ~/setup-pnpm-${{ runner.name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install Vercel CLI
        run: pnpm add -g vercel
      - name: Link Vercel Project
        run: vercel link --yes --project muzicmania --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: .
      - name: Deploy to Vercel
        if: runner.os == 'Windows'
        shell: powershell
        env:
          IS_PREVIEW: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'preview' }}
        run: |
          if ($env:IS_PREVIEW -eq 'true') {
            vercel --yes --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}
          } else {
            vercel --prod --yes --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}
          }
        working-directory: .
      - name: Deploy to Vercel (Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          IS_PREVIEW: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'preview' }}
        run: |
          if [ "$IS_PREVIEW" = "true" ]; then
            vercel --yes --archive=tgz --token="${{ secrets.VERCEL_TOKEN }}"
          else
            vercel --prod --yes --archive=tgz --token="${{ secrets.VERCEL_TOKEN }}"
          fi
        working-directory: .