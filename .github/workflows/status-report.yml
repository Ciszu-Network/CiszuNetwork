name: Status report

on:
  schedule:
    - cron: '10 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: status-report
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enviar estado semanal
        env:
          NOTIFY_TOPIC: ${{ secrets.NOTIFY_TOPIC }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/status-report.js
